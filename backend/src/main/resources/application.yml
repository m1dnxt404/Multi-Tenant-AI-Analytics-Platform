spring:
  application:
    name: analytics-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/analytics_platform
    username: ${DB_USER:analytics}
    password: ${DB_PASSWORD:analytics}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET search_path TO public

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        multiTenancy: SCHEMA
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

app:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007d}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    cookie-secure: ${COOKIE_SECURE:false}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

logging:
  level:
    com.platform.analytics: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
