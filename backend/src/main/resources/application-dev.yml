spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

logging:
  level:
    com.platform.analytics: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

app:
  seed:
    enabled: true

# Redis: default config (localhost:6379, no password) is used from application.yml.
# Ensure Redis is running: docker run -d -p 6379:6379 --name redis redis:alpine
